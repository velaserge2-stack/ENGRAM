name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: E2E (WebKit)
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps webkit
          BROWSER=webkit npm run e2e
          BROWSER=webkit npm run e2e:flows
          BROWSER=webkit npm run e2e:design
          BROWSER=webkit npm run e2e:mejoras
          BROWSER=webkit npm run e2e:mejoras2
          BROWSER=webkit npm run e2e:phone
          BROWSER=webkit npm run e2e:bloquec
          BROWSER=webkit npm run e2e:p5
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
